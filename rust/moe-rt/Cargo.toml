[package]
name = "moe-rt"
version = "0.0.1"
edition = "2021"
publish = false
description = "Runtime MoE em Rust sobre o CUDA Rust da NVIDIA (plano docs/PLANO-runtime-rust-moe-20261029.md). M1a: bloco MoE de uma camada."

# cuda-rust clonado em /home/brenoperucchi/Devs/GitHub/cuda-rust, commit 5759cb3 (29/10).
[dependencies]
cutile = { path = "../../../GitHub/cuda-rust/cutile-rs/cutile" }
cuda-core = { path = "../../../GitHub/cuda-rust/cuda-core" }
cuda-async = { path = "../../../GitHub/cuda-rust/cuda-async" }
moe-monitor = { path = "../moe-monitor" }
serde_json = "1"

[workspace]

[dev-dependencies]
trybuild = "1.0.49"
# A1.1: teste de propriedade do protocolo D1 contra o backend falso.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

# A1.1: o modelo das linhas do host e da GPU com `--cfg motor_loom` (ver src/motor/loom_tests.rs).
[target.'cfg(motor_loom)'.dev-dependencies]
loom = "=0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(motor_loom)"] }
